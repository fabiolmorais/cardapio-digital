name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build, testes (Testcontainers) e ArchUnit
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/backend-*.jar
          retention-days: 1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagem oficial do Playwright: já traz o Chromium e as bibliotecas do sistema, sem apt no CI.
    # A versão precisa ser a mesma do @playwright/test no frontend/package.json.
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cardapio
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d cardapio"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # Faz o papel do R2 (fotos): fala a API S3, sem chave de verdade.
      s3mock:
        image: adobe/s3mock:4.11.0
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: cardapio-e2e
    env:
      # Dentro do container, o Postgres do "services" responde pelo nome do serviço.
      DB_URL: jdbc:postgresql://postgres:5432/cardapio
      DB_USERNAME: ci
      DB_PASSWORD: ci-only
      JWT_SECRET: chave-do-ci-apenas-para-testes-0123456789abcdef
      STORAGE_ENDPOINT: http://s3mock:9090
      STORAGE_BUCKET: cardapio-e2e
      STORAGE_PUBLIC_URL: http://s3mock:9090/cardapio-e2e
      STORAGE_ACCESS_KEY_ID: ci
      STORAGE_SECRET_ACCESS_KEY: ci-only
      # Os testes ponta a ponta fazem centenas de logins do mesmo IP (Guia 32).
      RATE_LIMIT_ENABLED: "false"
      # O vídeo falso (o padrão é o Bunny) e a documentação da API, que confere os tipos do front (Guia 34).
      VIDEO_PROVIDER: fake
      OPENAPI_ENABLED: "true"
      API_URL: http://localhost:8080
      NEXT_PUBLIC_API_URL: http://localhost:8080
      # O CSP do front (Guia 34) libera o S3Mock, para onde o navegador envia as fotos no e2e.
      CSP_EXTRA_SOURCES: http://s3mock:9090
    steps:
      - uses: actions/checkout@v7
      - name: Libera a pasta do projeto para o Git
        # No container o Git roda como root, mas a pasta pertence ao usuário do runner.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Confere a versão do Playwright da imagem
        working-directory: frontend
        run: |
          PW=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          test "$PW" = "1.64.1" \
            || (echo "Playwright $PW no package-lock: atualize a imagem do container do job e2e" && exit 1)
      - uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-jar
      - name: Gera chaves VAPID só para este teste
        # O web push precisa de um par de chaves; geradas na hora, nenhuma fica no repositório.
        run: |
          node -e '
            const { generateKeyPairSync } = require("node:crypto");
            const jwk = generateKeyPairSync("ec", { namedCurve: "prime256v1" }).privateKey.export({ format: "jwk" });
            const b64 = (buf) => buf.toString("base64url");
            const pub = Buffer.concat([Buffer.from([4]), Buffer.from(jwk.x, "base64url"), Buffer.from(jwk.y, "base64url")]);
            console.log(`::add-mask::${jwk.d}`);
            require("node:fs").appendFileSync(process.env.GITHUB_ENV, `VAPID_PUBLIC_KEY=${b64(pub)}\nVAPID_PRIVATE_KEY=${jwk.d}\n`);
          '
      - name: Sobe o back-end
        run: |
          nohup java -jar backend-jar/backend-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          cat backend.log; exit 1
      - name: Confere se os tipos do front batem com a API
        working-directory: frontend
        run: |
          npm ci
          npm run gen:api
          git diff --exit-code src/lib/api/schema.d.ts || (echo "Rode npm run gen:api e commite os tipos" && exit 1)
      - name: Playwright
        working-directory: frontend
        run: |
          npm run build
          npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  dependency-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Avisa se falta a chave da NVD
        if: env.NVD_API_KEY == ''
        run: echo "::warning title=Dependency-Check pulado::Cadastre o segredo NVD_API_KEY (grátis em https://nvd.nist.gov/developers/request-an-api-key) para verificar vulnerabilidades nas dependências do back-end."
      - uses: actions/checkout@v7
        if: env.NVD_API_KEY != ''
      - uses: actions/setup-java@v6
        if: env.NVD_API_KEY != ''
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Cache da base de vulnerabilidades (NVD)
        if: env.NVD_API_KEY != ''
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-
      - name: OWASP Dependency-Check
        if: env.NVD_API_KEY != ''
        # Falsos positivos e riscos aceitos ficam em dependency-check-suppressions.xml, com justificativa e validade.
        run: ./mvnw -B org.owasp:dependency-check-maven:13.0.0:check -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY" -DsuppressionFile=dependency-check-suppressions.xml
