name: Deploy staging

# Publica o back-end no Fly.io depois que o CI passa na main.
# O front é publicado pela integração da Vercel com o GitHub (preview em PR, staging na main).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    if: github.event.workflow_run.conclusion == 'success' && vars.FLY_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.staging.toml
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
