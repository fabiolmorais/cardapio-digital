name: Deploy staging

# Publica o back-end no Fly.io depois que o CI passa na main.
# O front é publicado pela integração da Vercel com o GitHub (preview em PR, staging na main).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    if: github.event.workflow_run.conclusion == 'success' && vars.FLY_STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # A API do Fly às vezes falha por um instante (ex.: "stream error ... INTERNAL_ERROR" no
      # api.machines.dev, 11/11/2026). Tenta até 3 vezes antes de dar o deploy como perdido.
      - name: Deploy no Fly (até 3 tentativas)
        run: |
          for attempt in 1 2 3; do
            if flyctl deploy --remote-only --config fly.staging.toml; then
              exit 0
            fi
            echo "::warning::Deploy falhou na tentativa $attempt; tentando de novo em 30 s"
            sleep 30
          done
          exit 1
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
