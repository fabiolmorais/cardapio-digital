spring:
  config:
    import: []
sentry:
  dsn: ""
# Os testes conferem o contrato da API e os cabeçalhos do Swagger (Guia 34: em produção, desligado).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
app:
  # O serviço de vídeo falso, na própria aplicação (o Bunny é o padrão desde o Guia 34).
  video:
    provider: fake
  # Os testes fazem centenas de logins do mesmo IP; o RateLimitTest liga de novo, com limites pequenos.
  rate-limit:
    enabled: false
  security:
    jwt:
      secret: chave-so-para-testes-com-mais-de-32-bytes-0123456789
  # O resumo diário dos relatórios (ADR 0014) não roda sozinho nos testes: eles gravam dias passados
  # depois de a aplicação subir, e o ReportSummaryTest chama a tarefa quando precisa.
  reports:
    summary-initial-delay: P3650D
