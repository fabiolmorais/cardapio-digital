spring:
  application:
    name: cardapio
  config:
    # Em desenvolvimento, lê o .env da raiz do repositório (fora do Git).
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # Só o Flyway altera a estrutura do banco, com usuário próprio.
    user: ${FLYWAY_USERNAME:${DB_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
  default-produces-media-type: application/json

app:
  security:
    jwt:
      # Chave HMAC de pelo menos 32 bytes. Gere com: openssl rand -base64 48
      secret: ${JWT_SECRET}
      issuer: cardapio-digital
      access-token-ttl: 15m
    refresh-token:
      # Sessão dura até 14 dias sem uso; cada renovação conta de novo.
      ttl: 14d
      # Cookie só por HTTPS. Desligue (false) só para testar pelo IP da rede local, em http.
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  table-sessions:
    # De quanto em quanto tempo as sessões de mesa vencidas são encerradas (Guia 17).
    cleanup-interval: PT5M
  presence:
    # O cabeçalho com o IP do cliente que SÓ o proxy da hospedagem escreve (no Fly.io, Fly-Client-IP).
    # Vazio (desenvolvimento): vale o endereço da conexão. Nunca use X-Forwarded-For: o cliente o escreve.
    client-ip-header: ${CLIENT_IP_HEADER:}
  # Limite de tentativas por IP (Guia 32). O IP é o mesmo do app.presence.client-ip-header. Um
  # restaurante inteiro pode sair por um IP só (o Wi-Fi do salão): os limites da mesa são folgados.
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    rules:
      login: { requests: 20, window: 10m }
      password-reset: { requests: 10, window: 1h }
      pin: { requests: 60, window: 10m }
      pairing: { requests: 30, window: 1h }
      table-session: { requests: 600, window: 10m }
      table-actions: { requests: 300, window: 1m }
  # Endereço público do front: o QR Code de cada mesa aponta para {public-url}/m/{token}.
  # Para testar no celular pela rede local, use o IP da máquina (ver README).
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  devices:
    # Quanto tempo o código mostrado no aparelho novo vale para o gerente digitar.
    pairing-ttl: 10m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # Fotos dos produtos: um bucket do Cloudflare R2 (ver README). Nos testes, o S3Mock.
  storage:
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:}
    access-key-id: ${STORAGE_ACCESS_KEY_ID:}
    secret-access-key: ${STORAGE_SECRET_ACCESS_KEY:}
    public-url: ${STORAGE_PUBLIC_URL:}
  # O vídeo do prato (Guia 22). Até a Etapa 15, o serviço de vídeo falso (fake): o próprio back
  # recebe o envio. Com a conta do Bunny Stream: VIDEO_PROVIDER=bunny e as chaves (ver README).
  video:
    provider: ${VIDEO_PROVIDER:fake}
    # O segredo do aviso do serviço de vídeo (?token= na URL do webhook). Vazio recusa todo aviso.
    webhook-token: ${VIDEO_WEBHOOK_TOKEN:}
    bunny:
      library-id: ${BUNNY_LIBRARY_ID:}
      api-key: ${BUNNY_API_KEY:}
      cdn-host: ${BUNNY_CDN_HOST:}
    fake:
      # O endereço do back como o navegador o vê (no celular pela rede local, o IP da máquina).
      public-url: ${FAKE_VIDEO_PUBLIC_URL:http://localhost:8080}
  # As notificações no celular da equipe (Guia 29). Sem as chaves, o push fica desligado.
  # E-mail pelo Resend (Guia 33). Sem a chave, o e-mail só vai para o log (só o assunto).
  # O remetente precisa ser de um domínio verificado no Resend.
  email:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${EMAIL_FROM:Cardápio Digital <avisos@cardapio.local>}
    resend-url: https://api.resend.com
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:contato@cardapio.local}
    # Os serviços de push dos navegadores: Chrome/Android, Firefox, Safari/iPhone e Edge/Windows.
    # Mandar para qualquer outro endereço seria um SSRF (o servidor fazendo pedidos a mando do cliente).
    allowed-origins:
      - https://fcm.googleapis.com
      - https://updates.push.services.mozilla.com
      - https://web.push.apple.com
      - https://*.notify.windows.com

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  traces-sample-rate: 0.1
