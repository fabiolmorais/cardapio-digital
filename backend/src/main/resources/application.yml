spring:
  application:
    name: cardapio
  config:
    # Em desenvolvimento, lê o .env da raiz do repositório (fora do Git).
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # Só o Flyway altera a estrutura do banco, com usuário próprio.
    user: ${FLYWAY_USERNAME:${DB_USERNAME}}
    password: ${FLYWAY_PASSWORD:${DB_PASSWORD}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
  default-produces-media-type: application/json

app:
  security:
    jwt:
      # Chave HMAC de pelo menos 32 bytes. Gere com: openssl rand -base64 48
      secret: ${JWT_SECRET}
      issuer: cardapio-digital
      access-token-ttl: 15m
    refresh-token:
      # Sessão dura até 14 dias sem uso; cada renovação conta de novo.
      ttl: 14d
      # Cookie só por HTTPS. Desligue (false) só para testar pelo IP da rede local, em http.
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
  devices:
    # Quanto tempo o código mostrado no aparelho novo vale para o gerente digitar.
    pairing-ttl: 10m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  traces-sample-rate: 0.1
